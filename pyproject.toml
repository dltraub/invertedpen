[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invertedpen"
version = "0.1.0"
description = "Simulation and control experiments for an inverted pendulum"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "casadi",
    "numpy",
    "sympy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
invertedpen = "invertedpen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
